<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="bgclip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <clipPath id="bandclip">
      <rect x="-150" y="-4" width="300" height="40" rx="20"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#6E7C61"/>

  <g clip-path="url(#bgclip)">

    <!-- stacked sheets, back to front -->
    <rect x="152" y="146" width="240" height="286" rx="16" fill="#D9D4C3"/>
    <rect x="140" y="134" width="240" height="286" rx="16" fill="#E7E2D4"/>

    <g transform="translate(256,262) rotate(-3)">

      <!-- front sheet, pinched inward where the band wraps -->
      <path d="M -104,-146 L 104,-146 A 16 16 0 0 1 120,-130
               L 120,-4 C 120,4 98,8 98,16 C 98,24 120,28 120,36
               L 120,130 A 16 16 0 0 1 104,146
               L -104,146 A 16 16 0 0 1 -120,130
               L -120,36 C -120,28 -98,24 -98,16 C -98,8 -120,4 -120,-4
               L -120,-130 A 16 16 0 0 1 -104,-146 Z"
            fill="#F9F7F0"/>
      <path d="M 82 -146 L 120 -146 L 120 -108 Z" fill="#E5E0D1"/>

      <rect x="-82" y="-72" width="164" height="14" rx="7" fill="#CBC5B4"/>
      <rect x="-82" y="-40" width="110" height="14" rx="7" fill="#CBC5B4"/>
      <rect x="-82" y="86" width="140" height="14" rx="7" fill="#CBC5B4"/>

      <!-- soft press-shadow just outside the pinch -->
      <path d="M 96,0 C 108,10 108,22 96,32" stroke="#DCD6C6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M -96,0 C -108,10 -108,22 -96,32" stroke="#DCD6C6" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- rubber band hugging the pinch -->
      <g>
        <rect x="-150" y="-4" width="300" height="40" rx="20" fill="#B36A45"/>
        <g clip-path="url(#bandclip)">
          <rect x="-150" y="-4" width="300" height="13" fill="#C77E52"/>
          <rect x="-150" y="21" width="300" height="15" fill="#8F5236" opacity="0.55"/>
        </g>
      </g>
    </g>

    <!-- small leaf tucked behind the bottom-left corner of the stack -->
    <g transform="translate(150,404) rotate(-28)">
      <path d="M0,0 C 14,-22 40,-22 52,0 C 40,8 14,8 0,0 Z" fill="#84996C"/>
      <path d="M2,0 L 48,0" stroke="#5C7248" stroke-width="2" fill="none"/>
    </g>

  </g>
</svg>
